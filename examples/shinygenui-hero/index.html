<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShinyGenUI hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.2/dist/p5.brush.js"></script>
  <script src="../../src/p5.brush.skeleton.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7f8f5;
    }

    canvas {
      display: block;
    }

    /* The wordmark is HTML, positioned over the reserved card by script. */
    #wordmark {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Faculty Glyphic", serif;
      font-weight: 400;
      color: #386769;
      letter-spacing: 0.01em;
      white-space: nowrap;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="wordmark">ShinyGenUI</div>
  <script>
    // 1920 x 1280 blog post hero. The bento grid is laid out over an area one
    // cell larger than the canvas on every side, so cards run off all four
    // edges and the composition reads as a window onto a larger sheet. The
    // wordmark sits in a lifted 5 x 3 panel in the centre.
    const W = 1920;
    const H = 1280;
    const CELL = 160;
    const TITLE = { col: 4, row: 3, spanC: 5, spanR: 3, kind: "panel" };

    // Every component once before any repeats. Washes and hatches are accents:
    // they only go on 1 x 1 cards so no large block is left empty.
    const KINDS = [
      "kpi", "input", "tabs", "progress", "list", "chips", "slider", "pie",
      "image", "table", "calendar", "text", "avatar", "button", "bars", "line",
      "toggle", "wash", "hatch",
    ];
    const ACCENTS = ["wash", "hatch"];

    // True when two cells share an edge in grid units.
    function adjacent(a, b) {
      const overlapC = a.col < b.col + b.spanC && b.col < a.col + a.spanC;
      const overlapR = a.row < b.row + b.spanR && b.row < a.row + a.spanR;
      const besideC = a.col + a.spanC === b.col || b.col + b.spanC === a.col;
      const besideR = a.row + a.spanR === b.row || b.row + b.spanR === a.row;
      return (overlapR && besideC) || (overlapC && besideR);
    }

    // The least-used value in `pool` that no neighbour already has.
    function leastUsed(pool, used, avoid) {
      let candidates = pool.filter((v) => !avoid.has(v));
      if (candidates.length === 0) candidates = pool;
      const min = Math.min(...candidates.map((v) => used.get(v) || 0));
      return random(candidates.filter((v) => (used.get(v) || 0) === min));
    }

    // Give each card a kind and a color that none of its edge neighbours
    // share, so no two adjacent cards read as the same block.
    function vary(cells, palette) {
      const usedKind = new Map();
      const usedColor = new Map();
      for (const cell of cells) {
        if (cell.reserved) continue;
        const near = cells.filter((o) => o !== cell && !o.reserved && o.kind && adjacent(cell, o));
        const avoid = new Set(near.map((o) => o.kind));
        if (cell.spanC > 1 || cell.spanR > 1) ACCENTS.forEach((k) => avoid.add(k));
        cell.kind = leastUsed(KINDS, usedKind, avoid);
        cell.color = leastUsed(palette, usedColor, new Set(near.map((o) => o.color)));
        usedKind.set(cell.kind, (usedKind.get(cell.kind) || 0) + 1);
        usedColor.set(cell.color, (usedColor.get(cell.color) || 0) + 1);
      }
    }

    function setup() {
      pixelDensity(1);
      createCanvas(W, H, WEBGL);
      background("#f7f8f5");
      translate(-width / 2, -height / 2);

      angleMode(DEGREES);
      randomSeed(1920);
      noiseSeed(1920);
      brush.scaleBrushes(2);

      // One extra cell on each side; half of each edge card is cut off.
      // Straighter edges than the social preview: at this size a wiggle of
      // 1.2 makes long card edges wobble, so wiggle, jitter and tilt are all
      // reduced and the pencil and watercolor texture carry the sketch feel.
      const opts = {
        x: -CELL / 2,
        y: -CELL / 2,
        width: W + CELL,
        height: H + CELL,
        cols: 13,
        rows: 9,
        gutter: 24,
        reserve: [TITLE],
        wiggle: 0.4,
        jitter: 1.5,
        tilt: 1.2,
      };

      skeleton.dots(opts);
      const cells = skeleton.layout(opts);
      const title = cells.find((c) => c.reserved);
      title.angle = 0;
      vary(cells, skeleton.defaults.palette);
      skeleton.assign(cells, opts);

      brush.wiggle(opts.wiggle);
      cells.forEach((cell) => skeleton.drawCard(cell, opts));
      brush.noField();

      // Place the HTML wordmark over the title card.
      const el = document.getElementById("wordmark");
      el.style.left = title.x - title.w / 2 + "px";
      el.style.top = title.y - title.h / 2 + "px";
      el.style.width = title.w + "px";
      el.style.height = title.h + "px";
      el.style.fontSize = Math.round(title.h * 0.22) + "px";

      document.fonts.ready.then(() => {
        document.body.dataset.rendered = "true";
      });
    }
  </script>
</body>

</html>
